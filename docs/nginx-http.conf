# Optional http{}-level logging (outside the server{} block).
# $uri becomes /index.php after front-controller rewriting. Do not use $request,
# $request_uri, $args, $http_referer or cookies: those can contain bearer secrets.
log_format share_redacted '$remote_addr [$time_iso8601] $request_method $status $body_bytes_sent $request_time';
# In the server{} or final PHP location: access_log /var/log/nginx/share.log share_redacted;
