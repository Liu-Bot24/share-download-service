name: Verify Share Files
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, fileinfo, mbstring, pcntl, posix
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts
      - name: Syntax and transactional core
        run: |
          find src public scripts templates tests -name '*.php' -exec php -l {} \;
          php tests/run.php
          php tests/mutations.php
      - name: Atomic administrator and file-password throttling
        run: python3 tests/auth_rate_test.py
      - name: Preserved 3ca48d5 independent recovery migration and HTTP gates
        run: |
          python3 tests/verify_preserved_gate.py
          php tests/merge_gate_recovery.php
          php tests/merge_gate_migration.php
          python3 tests/merge_gate_fixture.py http
      - name: Private backup destination regressions
        run: python3 tests/backup_test.py
      - name: Live isolated HTTP regressions
        run: python3 tests/http_test.py
      - name: Install pinned browser test runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk nginx
      - name: Isolated Nginx routing and redacted logs
        run: python3 tests/nginx_test.py
      - name: Desktop and phone browser regressions
        run: node tests/browser.mjs
      - name: Preserved independent browser checks with explicit XHR compatibility
        run: python3 tests/merge_gate_fixture.py browser-compat
      - name: Package verified release with locked PHP dependencies
        env:
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/release
          printf '{"head":"%s","composer_lock_sha256":"%s"}\n' "$RELEASE_HEAD" "$(sha256sum composer.lock | cut -d' ' -f1)" > release.json
          tar -czf artifacts/release/share-download-service.tar.gz public src scripts templates vendor composer.json composer.lock download-route.conf README.md release.json
          sha256sum artifacts/release/share-download-service.tar.gz > artifacts/release/SHA256SUMS
      - name: Save verified deployable release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: share-release
          path: artifacts/release/
          retention-days: 7
          if-no-files-found: error
      - name: Save synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: share-ui-evidence
          path: |
            artifacts/browser/
            artifacts/gate/
          retention-days: 7
          if-no-files-found: ignore
