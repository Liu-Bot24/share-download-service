# REPLACEMENT location set for one BaoTa/Nginx server block, NOT an additive include.
# Follow docs/OPERATIONS.md: remove the old location /, download routes and PHP
# location include first; retain unrelated TLS/ACME/server settings after review.
# The server document root MUST be <project>/public and index MUST be index.php.
# Replace the clearly marked fastcgi_pass socket with the existing verified value.
# Do not enable fastcgi_cache/proxy_cache/CDN caching for these routes.
# The PHP streaming driver holds a file lock until transmission ends. Do not add
# X-Accel-Redirect without implementing and verifying a matching completion collector.
location ^~ /files/ { return 404; }
location ^~ /storage/ { return 404; }
location ^~ /src/ { return 404; }
location ^~ /scripts/ { return 404; }
location ^~ /templates/ { return 404; }
location ~ /\. { deny all; }
location /assets/ { try_files $uri =404; }
location / {
    access_log off;
    error_log /dev/null;
    try_files $uri /index.php$is_args$args;
}
location ^~ /d/ {
    access_log off;
    error_log /dev/null;
    rewrite ^ /index.php last;
}
location ^~ /transfer/ {
    access_log off;
    error_log /dev/null;
    rewrite ^ /index.php last;
}
location = /index.php {
    internal;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/REPLACE_WITH_VERIFIED_PHP_FPM_SOCKET;
    fastcgi_request_buffering on;
    fastcgi_buffering off;
    fastcgi_cache off;
    fastcgi_read_timeout 600s;
    # Nginx logs in the FINAL location after internal redirects. Keep this explicit.
    access_log off;
    # Standard Nginx error records cannot be given a URI-redacting log_format.
    # Application failures instead use private PHP request IDs and exception classes.
    error_log /dev/null;
}
location ~ \.php(?:/|$) { return 404; }
# At server level, use the redacted format from docs/nginx-http.conf (or access_log off)
# and error_log /dev/null. Verify CDN/WAF/FPM logs separately before exposing tokens.
# Configure PHP: upload_max_filesize=45M, post_max_size=46M; Nginx client_max_body_size 46m.
