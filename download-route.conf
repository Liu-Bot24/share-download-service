# Include in the BaoTa/Nginx server block; its document root MUST be <project>/public.
# Keep BaoTa's existing PHP-FPM include for /index.php. Never expose project root.
# Do not enable fastcgi_cache/proxy_cache/CDN caching for these routes.
# The PHP streaming driver holds a file lock until transmission ends. Do not add
# X-Accel-Redirect without implementing and verifying a matching completion collector.
location ^~ /files/ { return 404; }
location ^~ /storage/ { return 404; }
location ^~ /src/ { return 404; }
location ^~ /scripts/ { return 404; }
location ^~ /templates/ { return 404; }
location ~ /\. { deny all; }
location /assets/ { try_files $uri =404; }
location / {
    # Bearer tokens are part of /transfer URLs, so omit request URIs from logs.
    # Prefer the redacted access log format in docs/nginx-http.conf.
    access_log off;
    try_files $uri /index.php$is_args$args;
}
location ^~ /d/ {
    access_log off;
    rewrite ^ /index.php last;
}
location ^~ /transfer/ {
    access_log off;
    rewrite ^ /index.php last;
}
# Apply the redacted access log at server level too, or turn off the PHP location
# access log: internal rewrites may inherit the final location's logging policy.
# Configure PHP: upload_max_filesize=45M, post_max_size=46M; Nginx client_max_body_size 46m.
